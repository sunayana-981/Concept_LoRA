# Central dataset registry.
# hf_path: HuggingFace dataset id (used if local_path is absent or missing)
# local_path: absolute path on disk (takes priority over hf_path)
# split: which split to use for training SAE / running eval
# label_key: column name for integer class label
# hf_name: optional HuggingFace dataset config name

imagenet:
  hf_path: evanarlian/imagenet_1k_resized_256
  split: train
  label_key: label
  trust_remote_code: true
  n_classes: 1000
  classnames_file: configs/classnames/imagenet_classnames.txt

caltech101:
  hf_path: HuggingFaceM4/Caltech-101
  hf_name: with_background_category
  split: train
  label_key: label
  trust_remote_code: true
  n_classes: 102
  classnames_file: configs/classnames/caltech101_classnames.txt

