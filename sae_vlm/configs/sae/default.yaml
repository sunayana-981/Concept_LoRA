# Default SAE hyperparameters (CLIP / DINOv2 scale, d_model=768)
expansion_factor: 64          # d_sae = d_model * expansion_factor
l1_coefficient: 0.00008
lr: 0.0004
lr_scheduler: constantwithwarmup
lr_warm_up_steps: 500
batch_size: 16
total_training_tokens: 2621440
n_batches_in_store: 15
b_dec_init_method: geometric_median
use_ghost_grads: false
dead_feature_window: 64
dead_feature_threshold: 1.0e-6
feature_sampling_window: 64
n_checkpoints: 1
checkpoint_path: out/checkpoints
log_to_wandb: false
wandb_project: sae_vlm
seed: 42
